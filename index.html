<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        
        .con{
            height: 600px;
          /* border: 1px solid black; */
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .box{    
                   height:80%;
                   width: 80%;
            /* border: 1px solid black; */
            display: flex;
             box-shadow: 5px 5px 5px ;
             border-radius: 20px;
        }
.left,.center,.right{
              height: 100%;
              /* border: 1px solid black; */
            }
            .left{
                background-color: navy;
                width: 3%;
                border-radius: 20px;
            }
    .center{
        width: 62%;

          font-weight:500;
          color: navy;
          background-color: whitesmoke;
    }
    .center>p{
        margin-left: 30px;
    }
    *{
        margin: 0;
        padding:0;
        box-sizing: border-box;
    }
    .right{
        width: 35%;
        
        border-radius: 20px;

    }
    .top{
        height: 30%;
        /* border: 1px solid black; */
    }
    .bottom{
        height: 70%;
        /* border: 1px solid black; */
    }
    .top-in{
        height: 90%;
        background-color: navy;
        border-top-left-radius: 20px; 
         border-top-right-radius: 20px; 
        
      }
        
    .circle{
        height: 120px;
        width: 120px;
        position: absolute;
        top: 90px;
        right:270px;
        border: 5px solid navy;
        border-radius: 50%;
    }
    img{
        /* border:2px solid white; */
        height:100%;
        width: 100%;
        border-radius: 50%;

    }
    .bottom>h1{
        text-align: center;

    }
      .button{
        height:20%;
        /* border: 1px solid navy; */
        display: flex;
        justify-content: space-evenly;
        align-items: center;
      }  
      .button1{
        background-color: navy;
        height: 50%;
        width: 40%;
        border-radius: 20px;
        color: white;
     text-align: center;
     line-height: 30px;
      }
      .icon{
        height: 20%;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
      }
      .fa-instagram{
        background: linear-gradient(red,orange,pink);
        color: transparent;
        background-clip: text;
      }.fa-facebook{
        background: linear-gradient(blue);
        color: transparent;
        background-clip: text;
      }
      
      .fa-github{
        background: linear-gradient(black);
        color: transparent;
        background-clip: text;
      }
      .fa-linkedin{
        background: linear-gradient(blue);
        color: transparent;
            background-clip: text;}
    .fa-heart{
        color: red;
    }
    .fa-share{
        color: lightseagreen;
    }
    </style>
</head>

    <div class="con">
        <div class="box">

             <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="img1.jpg" alt=""></div>
                    </div>
                </div>
                <div class="bottom">
<h1>Website Developer</h1>
<h1>Dezyne Ecole College</h1>

</div>

<div class="button">

</div>

            <i class="fa fa-solid fa-share"></i>12.6K

             </div>

            </div>
        </div>

        </div>

</html>
